<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no">

<title>BumpBoy Alien Shooter V3.1</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050714;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font-family:inherit;
}

/* =========================================================
   MAIN GAME
========================================================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    cursor:crosshair;

    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(111,49,146,.40),
            transparent 28%
        ),
        radial-gradient(
            circle at 80% 35%,
            rgba(27,77,154,.40),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 85%,
            rgba(143,33,109,.22),
            transparent 30%
        ),
        linear-gradient(
            #060817,
            #11071d
        );
}

/* =========================================================
   STARS
========================================================= */

.star{
    position:absolute;
    border-radius:50%;
    background:white;
    pointer-events:none;
}

/* =========================================================
   TOP HUD
========================================================= */

#topHUD{
    position:absolute;
    z-index:100;

    top:0;
    left:0;

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    padding:15px 20px;

    font-size:clamp(17px,2.4vw,26px);
    font-weight:900;

    text-shadow:
        0 2px 5px black;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.80),
            transparent
        );
}

.hudBlock{
    white-space:nowrap;
}

#soundButton{
    border:1px solid rgba(255,255,255,.45);
    border-radius:10px;

    padding:8px 13px;

    background:rgba(0,0,0,.45);
    color:white;

    font-size:18px;

    cursor:pointer;
}

/* =========================================================
   GAME TITLE
========================================================= */

#gameTitle{
    position:absolute;
    z-index:30;

    top:62px;
    left:0;

    width:100%;

    text-align:center;

    font-size:clamp(30px,5vw,58px);
    font-weight:900;

    letter-spacing:3px;

    text-shadow:
        0 0 8px #62caff,
        0 0 20px rgba(225,66,255,.55),
        0 3px 5px black;

    pointer-events:none;
}

/* =========================================================
   ARENA
========================================================= */

#arena{
    position:absolute;

    top:125px;
    left:0;
    right:0;
    bottom:130px;

    overflow:hidden;
}

/* =========================================================
   ALIENS
========================================================= */

.alien{
    position:absolute;

    border:0;
    padding:0;

    background:transparent;

    cursor:crosshair;

    display:flex;
    justify-content:center;
    align-items:center;

    touch-action:manipulation;

    will-change:left,top,transform;
}

.alien img{
    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;

    filter:
        drop-shadow(
            0 0 12px
            rgba(109,255,181,.80)
        );
}

/* GREEN ALIEN */

.alien.normal{
    width:clamp(110px,13vw,160px);
    height:clamp(110px,13vw,160px);
}

/* UFO */

.alien.fast{
    width:clamp(140px,16vw,195px);
    height:clamp(100px,12vw,140px);
}

.alien.fast img{
    filter:
        drop-shadow(
            0 0 14px
            rgba(78,205,255,.90)
        )
        drop-shadow(
            0 0 8px
            rgba(255,60,221,.75)
        );
}

/* HEAVY ALIEN */

.alien.heavy{
    width:clamp(130px,15vw,180px);
    height:clamp(110px,13vw,155px);
}

.alien.heavy img{
    filter:
        drop-shadow(
            0 0 15px
            rgba(255,58,113,.90)
        );
}

/* BOSS */

.alien.boss{
    width:clamp(250px,28vw,350px);
    height:clamp(205px,23vw,285px);
}

.alien.boss img{
    filter:
        drop-shadow(
            0 0 22px
            rgba(173,68,255,.95)
        )
        drop-shadow(
            0 0 14px
            rgba(255,115,30,.80)
        );
}

/* =========================================================
   BOSS HEALTH
========================================================= */

#bossHealthWrap{
    position:absolute;

    z-index:80;

    top:110px;
    left:50%;

    transform:translateX(-50%);

    width:min(520px,70%);

    display:none;

    text-align:center;

    font-weight:900;
    font-size:16px;
}

#bossHealthBar{
    height:17px;

    margin-top:6px;

    border:2px solid white;
    border-radius:12px;

    overflow:hidden;

    background:rgba(0,0,0,.70);
}

#bossHealthFill{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff315c,
            #ff8b36,
            #ffe259
        );
}

/* =========================================================
   SHIP
========================================================= */

#ship{
    position:absolute;

    z-index:40;

    bottom:5px;
    left:50%;

    width:clamp(150px,17vw,215px);
    height:clamp(125px,14vw,175px);

    transform:translateX(-50%);

    pointer-events:none;

    animation:
        hoverShip
        1.5s
        ease-in-out
        infinite
        alternate;
}

#ship img{
    width:100%;
    height:100%;

    object-fit:contain;

    filter:
        drop-shadow(
            0 0 14px
            rgba(50,205,255,.90)
        )
        drop-shadow(
            0 0 11px
            rgba(255,40,220,.50)
        );
}

@keyframes hoverShip{

    from{
        transform:
            translateX(-50%)
            translateY(1px);
    }

    to{
        transform:
            translateX(-50%)
            translateY(-7px);
    }
}

/* =========================================================
   LASER
========================================================= */

.laser{
    position:absolute;

    z-index:50;

    width:6px;

    border-radius:6px;

    pointer-events:none;

    background:white;

    box-shadow:
        0 0 6px white,
        0 0 13px #54d8ff,
        0 0 22px #d543ff;

    transform-origin:
        bottom center;

    animation:
        laserFade
        .20s
        linear
        forwards;
}

@keyframes laserFade{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }
}

/* =========================================================
   EXPLOSION
========================================================= */

.explosionCore{
    position:absolute;

    z-index:70;

    width:18px;
    height:18px;

    border-radius:50%;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    background:#fff7a8;

    box-shadow:
        0 0 8px white,
        0 0 18px #ffd84a,
        0 0 35px #ff7a00,
        0 0 55px #ff2b00;

    animation:
        coreBlast        .55s
        ease-out
        forwards;
}

@keyframes coreBlast{

    0%{
        width:10px;
        height:10px;
        opacity:1;
    }

    35%{
        width:75px;
        height:75px;
        opacity:1;
        background:#ffd84a;
    }

    70%{
        width:105px;
        height:105px;
        opacity:.8;
        background:#ff6a00;
    }

    100%{
        width:135px;
        height:135px;
        opacity:0;
        background:#651100;
    }
}

.shockwave{
    position:absolute;

    z-index:69;

    width:15px;
    height:15px;

    border:
        4px solid
        rgba(255,215,80,.95);

    border-radius:50%;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 15px
        #ff7a00;

    animation:
        shock
        .6s
        ease-out
        forwards;
}

@keyframes shock{

    from{
        width:15px;
        height:15px;
        opacity:1;
    }

    to{
        width:160px;
        height:160px;
        opacity:0;
        border-width:1px;
    }
}

.spark{
    position:absolute;

    z-index:71;

    width:7px;
    height:7px;

    border-radius:50%;

    pointer-events:none;

    background:#ffe86b;

    box-shadow:
        0 0 8px
        #ff7a00;

    transform:
        translate(-50%,-50%);

    animation:
        sparkFly
        .55s
        ease-out
        forwards;
}

@keyframes sparkFly{

    from{
        transform:
            translate(-50%,-50%)
            translate(0,0)
            scale(1);

        opacity:1;
    }

    to{
        transform:
            translate(-50%,-50%)
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.15);

        opacity:0;
    }
}

.smoke{
    position:absolute;

    z-index:68;

    width:25px;
    height:25px;

    border-radius:50%;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    background:
        rgba(130,130,145,.55);

    filter:blur(5px);

    animation:
        smokeOut
        .9s
        ease-out
        forwards;
}

@keyframes smokeOut{

    from{
        width:25px;
        height:25px;

        opacity:.65;

        transform:
            translate(-50%,-50%)
            translateY(0);
    }

    to{
        width:100px;
        height:100px;

        opacity:0;

        transform:
            translate(-50%,-50%)
            translateY(-35px);
    }
}

/* =========================================================
   POINTS
========================================================= */

.points{
    position:absolute;

    z-index:90;

    font-size:28px;
    font-weight:900;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    text-shadow:
        0 2px 4px black,
        0 0 8px #ffdd58;

    animation:
        pointsFloat
        .8s
        ease-out
        forwards;
}

@keyframes pointsFloat{

    from{
        opacity:1;

        transform:
            translate(-50%,-50%);
    }

    to{
        opacity:0;

        transform:
            translate(-50%,-140%);
    }
}

/* =========================================================
   LEVEL MESSAGE
========================================================= */

#levelMessage{
    position:absolute;

    z-index:95;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    text-align:center;

    font-size:
        clamp(34px,7vw,78px);

    font-weight:900;

    text-shadow:
        0 4px 10px black,
        0 0 15px
        rgba(255,255,255,.7);

    pointer-events:none;

    opacity:0;
}

#flash{
    position:absolute;

    z-index:85;

    inset:0;

    background:white;

    opacity:0;

    pointer-events:none;
}

/* =========================================================
   START / GAME OVER PANEL
========================================================= */

#overlay{
    position:absolute;

    z-index:200;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(2,4,14,.92);

    text-align:center;
}

.panel{
    width:min(760px,90%);

    max-height:90vh;

    overflow:auto;

    padding:
        clamp(28px,4vw,48px);

    border:
        2px solid
        rgba(255,255,255,.30);

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(30,17,55,.97),
            rgba(8,15,38,.97)
        );

    box-shadow:
        0 0 35px
        rgba(110,67,255,.40),
        inset 0 0 25px
        rgba(255,255,255,.04);
}

.panel h1{
    margin:
        0 0 14px;

    font-size:
        clamp(38px,7vw,78px);

    letter-spacing:3px;

    text-shadow:
        0 0 10px #55cfff,
        0 0 22px #d747ff;
}

.panel h2{
    margin:
        8px 0 18px;

    font-size:
        clamp(24px,4vw,40px);
}

.panel p{
    margin:
        10px auto;

    max-width:620px;

    line-height:1.5;

    font-size:
        clamp(16px,2.2vw,22px);

    color:#e7e7ff;
}

#startButton{
    margin-top:25px;

    padding:
        16px 34px;

    border:0;
    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #48caff,
            #b24cff,
            #ff4cbd
        );

    color:white;

    font-size:
        clamp(20px,3vw,30px);

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 0 20px
        rgba(115,94,255,.55);
}

#startButton:hover{
    transform:scale(1.04);
}

/* =========================================================
   EXIT GAME BUTTON
========================================================= */

#exitGameButton{
    position:absolute;

    z-index:160;

    top:72px;
    right:18px;

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius:10px;

    padding:9px 14px;

    background:
        rgba(0,0,0,.72);

    color:white;

    font-size:
        clamp(13px,1.8vw,18px);

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 0 12px
        rgba(255,73,146,.35);
}

#exitGameButton:hover{
    background:
        rgba(130,25,72,.88);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:650px){

    #topHUD{
        padding:
            10px 9px;

        gap:5px;

        font-size:15px;
    }

    #soundButton{
        padding:
            6px 8px;

        font-size:14px;
    }

    #gameTitle{
        top:54px;

        font-size:29px;
    }

    #exitGameButton{
        top:92px;
        right:9px;

        padding:7px 10px;

        font-size:12px;
    }

    #arena{
        top:110px;
        bottom:105px;
    }

    #ship{
        width:125px;
        height:105px;
    }
}

</style>
</head>

<body>

<div id="game">

    <div id="topHUD">

        <div class="hudBlock">
            SCORE:
            <span id="score">0</span>
        </div>

        <div class="hudBlock">
            LEVEL:
            <span id="level">1</span>
        </div>

        <div class="hudBlock">
            LIVES:
            <span id="lives">❤️❤️❤️</span>
        </div>

        <div class="hudBlock">
            TIME:
            <span id="time">60</span>
        </div>

        <button
            id="soundButton"
            type="button">
            🔊 SOUND
        </button>

    </div>

    <div id="gameTitle">
        BUMPBOY ALIEN SHOOTER
    </div>

    <button
        id="exitGameButton"
        type="button">
        EXIT GAME
    </button>

    <div id="bossHealthWrap">

        BOSS HEALTH

        <div id="bossHealthBar">

            <div id="bossHealthFill">
            </div>

        </div>

    </div>

    <div id="arena">
    </div>

    <div id="ship">

        <img
            src="ship.png"
            alt="BumpBoy ship">

    </div>

    <div id="levelMessage">
    </div>

    <div id="flash">
    </div>

    <div id="overlay">

        <div class="panel">

            <h1>
                BUMPBOY
            </h1>

            <h2>
                👽 ALIEN SHOOTER 👽
            </h2>

            <p>
                Protect BumpBoy space from the alien invasion!
            </p>

            <p>
                Tap or click the aliens to fire.
                Missing a shot costs a life, so aim carefully.
            </p>

            <p>
                Reach the boss and defeat it before time runs out!
            </p>

            <button
                id="startButton"
                type="button">
                START GAME
            </button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const game =
    document.getElementById("game");

const arena =
    document.getElementById("arena");

const scoreText =
    document.getElementById("score");

const levelText =
    document.getElementById("level");

const livesText =
    document.getElementById("lives");

const timeText =
    document.getElementById("time");

const soundButton =
    document.getElementById("soundButton");

const overlay =
    document.getElementById("overlay");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const levelMessage =
    document.getElementById("levelMessage");

const flash =
    document.getElementById("flash");

const ship =
    document.getElementById("ship");

const bossHealthWrap =
    document.getElementById("bossHealthWrap");

const bossHealthFill =
    document.getElementById("bossHealthFill");

/* =========================================================
   GAME VARIABLES
========================================================= */

let score = 0;
let lives = 3;
let level = 1;
let timeLeft = 60;

let playing = false;
let soundOn = true;

let currentAlien = null;

let enemyTimer = null;
let gameClock = null;

let bossHits = 0;
let bossNeeded = 8;
let bossTime = 0;

let audioContext = null;

/* =========================================================
   IMAGE FILES
========================================================= */

const IMAGE_NORMAL =
    "alien1.png";

const IMAGE_FAST =
    "alien2.png";

const IMAGE_HEAVY =
    "alien3.png";

const IMAGE_BOSS =
    "boss.png";

/* =========================================================
   STAR BACKGROUND
========================================================= */

function createStars(){

    const totalStars = 85;

    for(
        let i = 0;
        i < totalStars;
        i++
    ){

        const star =
            document.createElement("div");

        star.className =
            "star";

        const size =
            Math.random() * 2.5 + 1;

        star.style.width =
            size + "px";

        star.style.height =
            size + "px";

        star.style.left =
            Math.random() * 100 + "%";

        star.style.top =
            Math.random() * 100 + "%";

        star.style.opacity =
            Math.random() * .75 + .2;

        game.appendChild(star);
    }
}

createStars();

/* =========================================================
   AUDIO
========================================================= */

function getAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext
                ||
                window.webkitAudioContext
            )();
    }

    if(
        audioContext.state
        ===
        "suspended"
    ){
        audioContext.resume();
    }

    return audioContext;
}

function tone(
    frequency,
    duration,
    type,
    volume
){

    if(!soundOn){
        return;
    }

    try{

        const ctx =
            getAudio();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type =
            type || "sine";

        osc.frequency.value =
            frequency;

        gain.gain.value =
            volume || .05;

        osc.connect(gain);
        gain.connect(
            ctx.destination
        );

        const now =
            ctx.currentTime;

        gain.gain.setValueAtTime(
            gain.gain.value,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );

        osc.start(now);
        osc.stop(
            now + duration
        );

    }
    catch(error){
    }
}/* =========================================================
   SOUND EFFECTS
========================================================= */

function laserSound(){

    if(!soundOn){
        return;
    }

    tone(
        620,
        .08,
        "square",
        .045
    );

    setTimeout(
        function(){

            tone(
                880,
                .07,
                "square",
                .03
            );

        },
        35
    );
}

function explosionSound(){

    if(!soundOn){
        return;
    }

    tone(
        110,
        .18,
        "sawtooth",
        .08
    );

    setTimeout(
        function(){

            tone(
                70,
                .22,
                "sawtooth",
                .055
            );

        },
        45
    );
}

function bossHitSound(){

    if(!soundOn){
        return;
    }

    tone(
        180,
        .10,
        "square",
        .07
    );

    setTimeout(
        function(){

            tone(
                130,
                .13,
                "sawtooth",
                .055
            );

        },
        55
    );
}

function loseLifeSound(){

    if(!soundOn){
        return;
    }

    tone(
        240,
        .15,
        "sawtooth",
        .06
    );

    setTimeout(
        function(){

            tone(
                160,
                .18,
                "sawtooth",
                .05
            );

        },
        90
    );
}

function levelSound(){

    if(!soundOn){
        return;
    }

    tone(
        440,
        .10,
        "sine",
        .05
    );

    setTimeout(
        function(){

            tone(
                660,
                .10,
                "sine",
                .05
            );

        },
        100
    );

    setTimeout(
        function(){

            tone(
                880,
                .16,
                "sine",
                .05
            );

        },
        200
    );
}

function winSound(){

    if(!soundOn){
        return;
    }

    const notes = [
        523,
        659,
        784,
        1047
    ];

    notes.forEach(
        function(note,index){

            setTimeout(
                function(){

                    tone(
                        note,
                        .25,
                        "sine",
                        .055
                    );

                },
                index * 120
            );
        }
    );
}

soundButton.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        soundOn =
            !soundOn;

        soundButton.textContent =
            soundOn
            ?
            "🔊 SOUND"
            :
            "🔇 MUTED";

        if(soundOn){

            tone(
                700,
                .08,
                "sine",
                .04
            );
        }
    }
);

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    scoreText.textContent =
        score;

    levelText.textContent =
        level;

    timeText.textContent =
        Math.max(
            0,
            timeLeft
        );

    let hearts = "";

    for(
        let i = 0;
        i < lives;
        i++
    ){
        hearts += "❤️";
    }

    if(
        hearts === ""
    ){
        hearts = "💀";
    }

    livesText.textContent =
        hearts;
}

/* =========================================================
   LEVEL SYSTEM
========================================================= */

function calculateLevel(){

    let newLevel = 1;

    if(score >= 320){

        newLevel = 4;
    }
    else if(score >= 180){

        newLevel = 3;
    }
    else if(score >= 80){

        newLevel = 2;
    }

    if(
        newLevel !== level
    ){

        level =
            newLevel;

        updateHUD();

        showLevelMessage(
            level === 4
            ?
            "BOSS LEVEL!"
            :
            "LEVEL " + level
        );

        levelSound();
    }
}

function showLevelMessage(text){

    levelMessage.textContent =
        text;

    levelMessage.style.opacity =
        "1";

    levelMessage.style.transform =
        "translate(-50%,-50%) scale(.75)";

    levelMessage.animate(
        [
            {
                opacity:0,
                transform:
                    "translate(-50%,-50%) scale(.65)"
            },
            {
                opacity:1,
                transform:
                    "translate(-50%,-50%) scale(1.12)"
            },
            {
                opacity:1,
                transform:
                    "translate(-50%,-50%) scale(1)"
            },
            {
                opacity:0,
                transform:
                    "translate(-50%,-50%) scale(1.1)"
            }
        ],
        {
            duration:1300,
            easing:"ease-out"
        }
    );

    setTimeout(
        function(){

            levelMessage.style.opacity =
                "0";

        },
        1300
    );
}

/* =========================================================
   ENEMY SETTINGS
========================================================= */

function getEnemyType(){

    if(level === 1){

        return {
            type:"normal",
            image:IMAGE_NORMAL,
            points:10,
            speed:1.35,
            lifetime:4300
        };
    }

    if(level === 2){

        if(
            Math.random() < .50
        ){

            return {
                type:"fast",
                image:IMAGE_FAST,
                points:20,
                speed:2.2,
                lifetime:3300
            };
        }

        return {
            type:"normal",
            image:IMAGE_NORMAL,
            points:10,
            speed:1.65,
            lifetime:3900
        };
    }

    if(level === 3){

        const roll =
            Math.random();

        if(roll < .34){

            return {
                type:"fast",
                image:IMAGE_FAST,
                points:20,
                speed:2.7,
                lifetime:2900
            };
        }

        if(roll < .68){

            return {
                type:"heavy",
                image:IMAGE_HEAVY,
                points:30,
                speed:1.5,
                lifetime:4000
            };
        }

        return {
            type:"normal",
            image:IMAGE_NORMAL,
            points:10,
            speed:2,
            lifetime:3400
        };
    }

    return {
        type:"boss",
        image:IMAGE_BOSS,
        points:250,
        speed:1.15,
        lifetime:15000
    };
}

/* =========================================================
   RANDOM POSITION
========================================================= */

function randomPosition(
    width,
    height
){

    const maxX =
        Math.max(
            10,
            arena.clientWidth
            -
            width
            -
            10
        );

    const maxY =
        Math.max(
            10,
            arena.clientHeight
            -
            height
            -
            10
        );

    return {
        x:
            Math.random()
            *
            maxX,

        y:
            Math.random()
            *
            maxY
    };
}

/* =========================================================
   LASER EFFECT
========================================================= */

function fireLaser(
    targetX,
    targetY
){

    const gameRect =
        game.getBoundingClientRect();

    const shipRect =
        ship.getBoundingClientRect();

    const startX =
        shipRect.left
        +
        shipRect.width / 2
        -
        gameRect.left;

    const startY =
        shipRect.top
        +
        18
        -
        gameRect.top;

    const dx =
        targetX
        -
        startX;

    const dy =
        targetY
        -
        startY;

    const distance =
        Math.sqrt(
            dx * dx
            +
            dy * dy
        );

    const angle =
        Math.atan2(
            dy,
            dx
        )
        *
        180
        /
        Math.PI
        +
        90;

    const laser =
        document.createElement(
            "div"
        );

    laser.className =
        "laser";

    laser.style.left =
        startX + "px";

    laser.style.top =
        (
            startY
            -
            distance
        )
        +
        "px";

    laser.style.height =
        distance + "px";

    laser.style.transform =
        "rotate("
        +
        angle
        +
        "deg)";

    game.appendChild(
        laser
    );

    laserSound();

    setTimeout(
        function(){

            laser.remove();

        },
        230
    );
}

/* =========================================================
   EXPLOSION EFFECT
========================================================= */

function createExplosion(
    x,
    y
){

    const core =
        document.createElement(
            "div"
        );

    core.className =
        "explosionCore";

    core.style.left =
        x + "px";

    core.style.top =
        y + "px";

    game.appendChild(
        core
    );

    const shock =
        document.createElement(
            "div"
        );

    shock.className =
        "shockwave";

    shock.style.left =
        x + "px";

    shock.style.top =
        y + "px";

    game.appendChild(
        shock
    );

    for(
        let i = 0;
        i < 12;
        i++
    ){

        const spark =
            document.createElement(
                "div"
            );

        spark.className =
            "spark";

        spark.style.left =
            x + "px";

        spark.style.top =
            y + "px";

        const angle =
            Math.random()
            *
            Math.PI
            *
            2;

        const distance =
            45
            +
            Math.random()
            *
            80;

        spark.style.setProperty(
            "--dx",
            (
                Math.cos(angle)
                *
                distance
            )
            +
            "px"
        );

        spark.style.setProperty(
            "--dy",
            (
                Math.sin(angle)
                *
                distance
            )
            +
            "px"
        );

        game.appendChild(
            spark
        );

        setTimeout(
            function(){

                spark.remove();

            },
            650
        );
    }

    const smoke =
        document.createElement(
            "div"
        );

    smoke.className =
        "smoke";

    smoke.style.left =
        x + "px";

    smoke.style.top =
        y + "px";

    game.appendChild(
        smoke
    );

    explosionSound();

    setTimeout(
        function(){

            core.remove();
            shock.remove();
            smoke.remove();

        },
        950
    );
}

/* =========================================================
   POINT EFFECT
========================================================= */

function showPoints(
    x,
    y,
    amount
){

    const points =
        document.createElement(
            "div"
        );

    points.className =
        "points";

    points.textContent =
        "+"
        +
        amount;

    points.style.left =
        x + "px";

    points.style.top =
        y + "px";

    game.appendChild(
        points
    );

    setTimeout(
        function(){

            points.remove();

        },
        850
    );
}

/* =========================================================
   FLASH
========================================================= */

function screenFlash(){

    flash.animate(
        [
            {
                opacity:.5
            },
            {
                opacity:0
            }
        ],
        {
            duration:180,
            easing:"ease-out"
        }
    );
}

/* =========================================================
   REMOVE CURRENT ENEMY
========================================================= */

function clearEnemy(){

    if(enemyTimer){

        clearTimeout(
            enemyTimer
        );

        enemyTimer = null;
    }

    if(currentAlien){

        currentAlien.remove();

        currentAlien = null;
    }

    bossHealthWrap.style.display =
        "none";
}/* =========================================================
   LOSE LIFE
========================================================= */

function loseLife(){

    if(!playing){
        return;
    }

    lives--;

    updateHUD();

    loseLifeSound();

    screenFlash();

    if(lives <= 0){

        gameOver();

        return;
    }
}

/* =========================================================
   MOVE ENEMY
========================================================= */

function moveEnemy(
    alien,
    settings
){

    let directionX =
        Math.random() < .5
        ?
        -1
        :
        1;

    let directionY =
        Math.random() < .5
        ?
        -1
        :
        1;

    let lastTime =
        performance.now();

    function animate(now){

        if(
            !playing
            ||
            !alien.isConnected
        ){
            return;
        }

        const delta =
            Math.min(
                2.5,
                (
                    now
                    -
                    lastTime
                )
                /
                16.67
            );

        lastTime =
            now;

        let x =
            parseFloat(
                alien.style.left
            )
            ||
            0;

        let y =
            parseFloat(
                alien.style.top
            )
            ||
            0;

        x +=
            directionX
            *
            settings.speed
            *
            delta;

        y +=
            directionY
            *
            settings.speed
            *
            delta;

        const alienWidth =
            alien.offsetWidth;

        const alienHeight =
            alien.offsetHeight;

        const maxX =
            Math.max(
                0,
                arena.clientWidth
                -
                alienWidth
            );

        const maxY =
            Math.max(
                0,
                arena.clientHeight
                -
                alienHeight
            );

        if(x <= 0){

            x = 0;

            directionX = 1;
        }

        if(x >= maxX){

            x = maxX;

            directionX = -1;
        }

        if(y <= 0){

            y = 0;

            directionY = 1;
        }

        if(y >= maxY){

            y = maxY;

            directionY = -1;
        }

        alien.style.left =
            x + "px";

        alien.style.top =
            y + "px";

        requestAnimationFrame(
            animate
        );
    }

    requestAnimationFrame(
        animate
    );
}

/* =========================================================
   HIT NORMAL ENEMY
========================================================= */

function hitEnemy(
    alien,
    settings,
    event
){

    if(
        !playing
        ||
        alien !== currentAlien
    ){
        return;
    }

    event.stopPropagation();

    const gameRect =
        game.getBoundingClientRect();

    const rect =
        alien.getBoundingClientRect();

    const centerX =
        rect.left
        +
        rect.width / 2
        -
        gameRect.left;

    const centerY =
        rect.top
        +
        rect.height / 2
        -
        gameRect.top;

    fireLaser(
        centerX,
        centerY
    );

    clearTimeout(
        enemyTimer
    );

    enemyTimer = null;

    score +=
        settings.points;

    showPoints(
        centerX,
        centerY,
        settings.points
    );

    createExplosion(
        centerX,
        centerY
    );

    alien.remove();

    currentAlien =
        null;

    calculateLevel();

    updateHUD();

    setTimeout(
        function(){

            if(playing){

                spawnEnemy();
            }

        },
        250
    );
}

/* =========================================================
   HIT BOSS
========================================================= */

function hitBoss(
    alien,
    settings,
    event
){

    if(
        !playing
        ||
        alien !== currentAlien
    ){
        return;
    }

    event.stopPropagation();

    const gameRect =
        game.getBoundingClientRect();

    const rect =
        alien.getBoundingClientRect();

    const centerX =
        rect.left
        +
        rect.width / 2
        -
        gameRect.left;

    const centerY =
        rect.top
        +
        rect.height / 2
        -
        gameRect.top;

    fireLaser(
        centerX,
        centerY
    );

    bossHits++;

    bossHitSound();

    screenFlash();

    const percent =
        Math.max(
            0,
            100
            -
            (
                bossHits
                /
                bossNeeded
                *
                100
            )
        );

    bossHealthFill.style.width =
        percent + "%";

    alien.animate(
        [
            {
                transform:
                    "scale(1)"
            },
            {
                transform:
                    "scale(.90)"
            },
            {
                transform:
                    "scale(1.08)"
            },
            {
                transform:
                    "scale(1)"
            }
        ],
        {
            duration:180
        }
    );

    if(
        bossHits >=
        bossNeeded
    ){

        clearTimeout(
            enemyTimer
        );

        enemyTimer =
            null;

        score +=
            settings.points;

        updateHUD();

        showPoints(
            centerX,
            centerY,
            settings.points
        );

        createExplosion(
            centerX,
            centerY
        );

        alien.remove();

        currentAlien =
            null;

        bossHealthWrap.style.display =
            "none";

        setTimeout(
            function(){

                winGame();

            },
            650
        );
    }
}

/* =========================================================
   ENEMY ESCAPED
========================================================= */

function enemyEscaped(
    alien
){

    if(
        !playing
        ||
        alien !== currentAlien
    ){
        return;
    }

    alien.remove();

    currentAlien =
        null;

    enemyTimer =
        null;

    bossHealthWrap.style.display =
        "none";

    loseLife();

    if(
        playing
        &&
        lives > 0
    ){

        setTimeout(
            function(){

                spawnEnemy();

            },
            350
        );
    }
}

/* =========================================================
   SPAWN ENEMY
========================================================= */

function spawnEnemy(){

    if(!playing){
        return;
    }

    clearEnemy();

    calculateLevel();

    const settings =
        getEnemyType();

    const alien =
        document.createElement(
            "button"
        );

    alien.type =
        "button";

    alien.className =
        "alien "
        +
        settings.type;

    const image =
        document.createElement(
            "img"
        );

    image.src =
        settings.image;

    image.alt =
        settings.type
        +
        " alien";

    image.draggable =
        false;

    alien.appendChild(
        image
    );

    arena.appendChild(
        alien
    );

    currentAlien =
        alien;

    /*
       Wait until the browser knows the alien's
       real displayed dimensions before positioning it.
       This keeps the larger V3.1 aliens inside the arena.
    */

    const width =
        alien.offsetWidth;

    const height =
        alien.offsetHeight;

    const position =
        randomPosition(
            width,
            height
        );

    alien.style.left =
        position.x + "px";

    alien.style.top =
        position.y + "px";

    if(
        settings.type
        ===
        "boss"
    ){

        bossHits = 0;

        bossTime = 15;

        bossHealthFill.style.width =
            "100%";

        bossHealthWrap.style.display =
            "block";

        alien.addEventListener(
            "click",
            function(event){

                hitBoss(
                    alien,
                    settings,
                    event
                );
            }
        );
    }
    else{

        alien.addEventListener(
            "click",
            function(event){

                hitEnemy(
                    alien,
                    settings,
                    event
                );
            }
        );
    }

    moveEnemy(
        alien,
        settings
    );

    enemyTimer =
        setTimeout(
            function(){

                enemyEscaped(
                    alien
                );

            },
            settings.lifetime
        );
}

/* =========================================================
   MISSED SHOT
========================================================= */

arena.addEventListener(
    "click",
    function(event){

        if(!playing){
            return;
        }

        if(
            event.target.closest(
                ".alien"
            )
        ){
            return;
        }

        const gameRect =
            game.getBoundingClientRect();

        const x =
            event.clientX
            -
            gameRect.left;

        const y =
            event.clientY
            -
            gameRect.top;

        fireLaser(
            x,
            y
        );

        loseLife();
    }
);

/* =========================================================
   GAME CLOCK
========================================================= */

function startClock(){

    if(gameClock){

        clearInterval(
            gameClock
        );
    }

    gameClock =
        setInterval(
            function(){

                if(!playing){
                    return;
                }

                timeLeft--;

                if(
                    level === 4
                    &&
                    currentAlien
                ){

                    bossTime--;
                }

                updateHUD();

                if(
                    timeLeft <= 0
                ){

                    gameOver();
                }

            },
            1000
        );
}/* =========================================================
   START GAME
========================================================= */

function startGame(){

    clearEnemy();

    if(gameClock){

        clearInterval(
            gameClock
        );

        gameClock = null;
    }

    score = 0;
    lives = 3;
    level = 1;
    timeLeft = 60;

    bossHits = 0;
    bossTime = 0;

    playing = true;

    bossHealthWrap.style.display =
        "none";

    bossHealthFill.style.width =
        "100%";

    overlay.style.display =
        "none";

    updateHUD();

    showLevelMessage(
        "LEVEL 1"
    );

    levelSound();

    setTimeout(
        function(){

            if(playing){

                spawnEnemy();
            }

        },
        500
    );

    startClock();
}

/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    if(!playing){
        return;
    }

    playing = false;

    clearEnemy();

    if(gameClock){

        clearInterval(
            gameClock
        );

        gameClock = null;
    }

    bossHealthWrap.style.display =
        "none";

    overlay.style.display =
        "flex";

    overlay.innerHTML =
        `
        <div class="panel">

            <h1>
                GAME OVER
            </h1>

            <h2>
                SCORE: ${score}
            </h2>

            <p>
                The aliens got through this time!
            </p>

            <p>
                Get back in your BB Star Cruiser
                and try again.
            </p>

            <button
                id="restartButton"
                type="button">
                PLAY AGAIN
            </button>

        </div>
        `;

    const restartButton =
        document.getElementById(
            "restartButton"
        );

    restartButton.style.marginTop =
        "25px";

    restartButton.style.padding =
        "16px 34px";

    restartButton.style.border =
        "0";

    restartButton.style.borderRadius =
        "15px";

    restartButton.style.background =
        "linear-gradient(135deg,#48caff,#b24cff,#ff4cbd)";

    restartButton.style.color =
        "white";

    restartButton.style.fontSize =
        "24px";

    restartButton.style.fontWeight =
        "900";

    restartButton.style.cursor =
        "pointer";

    restartButton.addEventListener(
        "click",
        function(e){

            e.stopPropagation();

            startGame();
        }
    );
}

/* =========================================================
   WIN GAME
========================================================= */

function winGame(){

    playing = false;

    clearEnemy();

    if(gameClock){

        clearInterval(
            gameClock
        );

        gameClock = null;
    }

    bossHealthWrap.style.display =
        "none";

    updateHUD();

    winSound();

    overlay.style.display =
        "flex";

    overlay.innerHTML =
        `
        <div class="panel">

            <h1>
                YOU WIN!
            </h1>

            <h2>
                👑 BOSS DEFEATED 👑
            </h2>

            <p>
                Final Score:
                <strong>${score}</strong>
            </p>

            <p>
                BumpBoy space is safe!
            </p>

            <button
                id="restartButton"
                type="button">
                PLAY AGAIN
            </button>

        </div>
        `;

    const restartButton =
        document.getElementById(
            "restartButton"
        );

    restartButton.style.marginTop =
        "25px";

    restartButton.style.padding =
        "16px 34px";

    restartButton.style.border =
        "0";

    restartButton.style.borderRadius =
        "15px";

    restartButton.style.background =
        "linear-gradient(135deg,#48caff,#b24cff,#ff4cbd)";

    restartButton.style.color =
        "white";

    restartButton.style.fontSize =
        "24px";

    restartButton.style.fontWeight =
        "900";

    restartButton.style.cursor =
        "pointer";

    restartButton.addEventListener(
        "click",
        function(e){

            e.stopPropagation();

            startGame();
        }
    );
}

/* =========================================================
   EXIT GAME — SIGNAL SECOND LIFE HUD
========================================================= */

exitGameButton.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        playing = false;

        clearEnemy();

        if(gameClock){

            clearInterval(
                gameClock
            );

            gameClock = null;
        }

        bossHealthWrap.style.display =
            "none";

        /*
           Signal the BUMPBOY_GAMES_HUD controller
           by changing the MOAP page's current URL.

           HUD Controller V1.3 will detect:
           bumpboy_exit=1

           Then it will hide the HUD and reset
           the game URL for the next launch.
        */

        window.location.href =
            "https://mrmusiqnote-oss.github.io/bumpboy-games/?bumpboy_exit=1&t="
            +
            Date.now();
    }
);

/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        startGame();
    }
);

/* =========================================================
   INITIAL HUD
========================================================= */

updateHUD();

</script>
